# Local Postgres + Redis for kito-n8n development.
# Docs: .kito-docs/huong-dan-cai-dat.md
# Usage:
#   docker compose -f docker/kito-n8n/docker-compose.yml up -d
#   copy n8n.env → packages/cli/bin/.env
#   pnpm dev:be

services:
  postgres:
    image: postgres:16-alpine
    container_name: kito-n8n-postgres
    restart: unless-stopped
    networks:
      - kito-n8n-net
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: n8n_db
      POSTGRES_USER: ktuser
      POSTGRES_PASSWORD: kt123qwe***
    volumes:
      - kito-n8n-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ktuser -d n8n_db']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: kito-n8n-redis
    restart: unless-stopped
    networks:
      - kito-n8n-net
    ports:
      - '6379:6379'
    volumes:
      - kito-n8n-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  kito-n8n-net:
    name: kito-n8n-net
    driver: bridge
    ipam:
      config:
        # Subnet riêng — tránh đụng bridge mặc định (172.17) / testcontainers (172.18+)
        - subnet: 172.28.10.0/24
          gateway: 172.28.10.1

volumes:
  kito-n8n-postgres-data:
  kito-n8n-redis-data:
